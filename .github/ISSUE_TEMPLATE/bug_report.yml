name: Bug report
description: The card draws something wrong or does not load
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what the card did. A screenshot helps; hide anything you would rather keep private.
    validations:
      required: true
  - type: dropdown
    id: sensor
    attributes:
      label: Which sensors does the card read?
      options:
        - Life Dashboard integration
        - Another integration or a sensor of my own
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The card, Home Assistant, and the integration the sensors come from.
      placeholder: "Card 0.1.0, Home Assistant 2026.11.0, Life Dashboard integration 1.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
      placeholder: "Chrome on a laptop, or the Companion app on an iPhone"
  - type: textarea
    id: attributes
    attributes:
      label: The sensors
      description: Each sensor's unit and state class, and whether its statistics show days in a statistics graph card. Please leave out the values if you would rather not share them.
